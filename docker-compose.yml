services:
  kafka-init:
    # Init container: Kafka gets ownership of its data volume before broker starts.
    image: alpine:3.20
    container_name: kafka-init
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - kafka_data:/data
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kafka-logs
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: taxi_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: taxi
    ports:
      # Reachable from host machine only, not from network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxi_user -d taxi"]
      interval: 10s
      timeout: 5s
      retries: 5
  producer:
    build:
      context: .
      dockerfile: src/producer/Dockerfile
    container_name: producer
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONUNBUFFERED: 1
    # One-off replay: prevent producer from sending all trips again
    restart: "no"
  processing:
    build:
      context: .
      dockerfile: src/processing/Dockerfile
    container_name: processing
    platform: linux/amd64
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      PYTHONUNBUFFERED: 1
      # Checkpoint every 3 min; set to 0 in .env to disable
      CHECKPOINT_INTERVAL_MS: ${CHECKPOINT_INTERVAL_MS:-180000}
    # Replay topics from beginning on restart after crash
    restart: on-failure
volumes:
  postgres_data:
  kafka_data: